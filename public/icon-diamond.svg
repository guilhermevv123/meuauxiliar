        #00b4d8   2.18 / 2.46 / 6.53   o ciano antigo: invisível no claro

    O mínimo da WCAG para elemento gráfico é 3.0. O ciano original dava 2.18
    contra a barra clara — some por medida, não por impressão. Ao mexer na cor,
    refaça essa conta: um tom só fica bonito num dos fundos se ninguém olhar o
    outro.
  -->
