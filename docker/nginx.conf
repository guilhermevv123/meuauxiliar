# nginx do Diamond Lembretes.
#
# As regras de cache aqui espelham as do service worker de propósito — se as
# duas discordarem, o usuário fica preso numa versão velha e o bug é infernal
# de diagnosticar à distância:
#   • index.html e sw.js  → NUNCA cacheados (é como a versão nova chega);
#   • /assets/*           → cache de 1 ano (o nome tem hash do conteúdo).

server {
  listen 80;
  # IPv6 também: sem esta linha, qualquer coisa que chame "localhost" dentro
  # do container (healthcheck, sidecar, proxy) resolve ::1 e leva connection
  # refused, mesmo com o nginx de pé.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão: o bundle é o grosso do download.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # SPA: qualquer rota desconhecida devolve o index e o React resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Imutáveis — o nome muda a cada build.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O service worker precisa ser sempre revalidado, senão ele mesmo se
  # perpetua e o app nunca atualiza.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  # Cabeçalhos de segurança. Sem CSP restritiva aqui de propósito: o app fala
  # com Supabase e OpenAI por domínios que mudam conforme o projeto, e uma CSP
  # errada quebra o login silenciosamente. Ajuste se for expor publicamente.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
