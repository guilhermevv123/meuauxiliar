name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Sem passo de secrets DE PROPÓSITO: o workflow antigo injetava
      # VITE_OPENAI_API_KEY no bundle — a chave da OpenAI ia parar no
      # navegador de qualquer visitante. Hoje ela vive só nas Edge Functions
      # do Supabase; o front carrega apenas URL + chave anon (públicas).
      - run: npm ci
      - run: npm run build -- --base=/
      - name: Disable Jekyll
        run: echo > dist/.nojekyll
      - name: Custom domain
        run: echo "meuauxiliar.com" > dist/CNAME
      # SPA no Pages: rota direta (ex. /login) cai no 404 do GitHub — servir o
      # index no 404 devolve o app e o React Router assume.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
